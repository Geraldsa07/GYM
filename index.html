<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora de gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2343C9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de máx. 560px con barra de pestañas fija abajo. Números grandes en condensada, como el marcador de un rack; discos con los colores reales de competencia. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#13181F; --muted:#586270; --line:#D5DBE2;
  --accent:#2343C9; --accent-ink:#FFFFFF; --accent-soft:#E2E7FA;
  --ok:#1E7A4C; --ok-ink:#FFFFFF; --ok-soft:#DCF0E5; --warn:#9A4A10; --warn-soft:#FBEBDD; --danger:#B3261E;
  --chip-edge:rgba(0,0,0,.28);
  --p25:#C62828; --p25t:#FFFFFF; --p20:#1D4ED8; --p20t:#FFFFFF; --p15:#F2C500; --p15t:#1B1B1B;
  --p10:#1E8E4A; --p10t:#FFFFFF; --p5:#F4F4F4; --p5t:#1B1B1B; --p2h:#2A2A2A; --p2ht:#FFFFFF; --p1q:#B9C0C8; --p1qt:#1B1B1B;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1318; --surface:#181D24; --surface2:#20262E; --ink:#E9EDF2; --muted:#98A3B0; --line:#2D353F;
    --accent:#8CA0FF; --accent-ink:#0E1330; --accent-soft:#1F2748;
    --ok:#5CCB8F; --ok-ink:#06210F; --ok-soft:#173226; --warn:#F0A366; --warn-soft:#3A2515; --danger:#FF8A80;
    --chip-edge:rgba(255,255,255,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#181D24; --surface2:#20262E; --ink:#E9EDF2; --muted:#98A3B0; --line:#2D353F;
  --accent:#8CA0FF; --accent-ink:#0E1330; --accent-soft:#1F2748;
  --ok:#5CCB8F; --ok-ink:#06210F; --ok-soft:#173226; --warn:#F0A366; --warn-soft:#3A2515; --danger:#FF8A80;
  --chip-edge:rgba(255,255,255,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 var(--font-body);
  padding-block:10px 150px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 0 14px}
h1,.h2,.h3{font-family:var(--font-display);margin:0;font-weight:700}
h1{font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.date{color:var(--muted);font-size:14px;text-align:right}
.date::first-letter{text-transform:uppercase}
.date-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segb{min-height:36px;min-width:46px;padding:0 10px;border:0;background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.h2{font-size:28px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.h3{font-size:22px;line-height:1.1;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.sm{font-size:14px}
.tn{font-variant-numeric:tabular-nums}
p{margin:0}
main{display:flex;flex-direction:column;gap:14px}
.titlebar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.in{flex:1 1 160px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn.danger{color:var(--danger)}
.btn.dangerfill{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}
.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);padding:0 10px;font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.in.c{text-align:center;padding:0 4px}
select.in{padding-right:6px}
.note{padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;min-width:0}
.pick-n{font-family:var(--font-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.pick-s{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.timer{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-head .h3{overflow-wrap:anywhere}
.ex-head{align-items:center}
.ex-head .h3{flex:1 1 120px;min-width:0}
.ex-head .seg{flex-shrink:0}
.ex-head .segb{min-width:40px}
.target{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sethead,.setrow{display:grid;grid-template-columns:32px minmax(0,1fr) 70px 58px 44px;gap:6px;align-items:center}
.sethead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.sethead span:nth-child(2){text-align:left}
.setrow .sn{font-family:var(--font-display);font-weight:600;font-size:18px;text-align:center;color:var(--muted)}
.setrow .pv{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow.done .in{background:var(--ok-soft);border-color:transparent}
.chk{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.chk.on{background:var(--ok);border-color:transparent;color:var(--ok-ink)}
.chk svg{width:22px;height:22px}
.ex-foot{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pl-out{display:flex;flex-direction:column;gap:8px}
.pl-chips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:6px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--chip-edge)}
.pchip.p25{background:var(--p25);color:var(--p25t)} .pchip.p20{background:var(--p20);color:var(--p20t)}
.pchip.p15{background:var(--p15);color:var(--p15t)} .pchip.p10{background:var(--p10);color:var(--p10t)}
.pchip.p5{background:var(--p5);color:var(--p5t)} .pchip.p2h{background:var(--p2h);color:var(--p2ht)}
.pchip.p1q{background:var(--p1q);color:var(--p1qt)}
.rt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rt-list li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.rt-list li span:first-child{min-width:0;overflow-wrap:anywhere}
.rex{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.rex-top{display:flex;justify-content:space-between;align-items:center}
.rex-top .lbl{margin:0}
.hist-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hist-date{font-weight:600;text-transform:capitalize}
.hist-det{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.hist-det b{font-weight:600}
.hist-det div{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2px dashed var(--muted)}
.chart{width:100%;height:auto;display:block;max-width:100%}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tl{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .l1{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .l2{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.chart .dot2{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.chart .vl{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-body)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--muted);text-align:left;padding:4px 0}
.tbl td{padding:6px 0;border-top:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.empty p{color:var(--muted)}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.how-tip{font-size:14px;color:var(--muted);padding:8px 10px;border-radius:8px;background:var(--surface2)}
.lib-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:44px}
.lib-n{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.lib-m{font-size:13px;color:var(--muted)}
.chipbtn{flex:0 0 auto}
button.sn{height:40px;width:32px;padding:0;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--muted)}
button.sn.w{background:var(--warn-soft);color:var(--warn)}
button.sn.d{background:var(--accent-soft);color:var(--accent)}
.prchip{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:60px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.qn{font-family:var(--font-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.qs{font-size:13px;color:var(--muted)}
.qs.ok{color:var(--ok)}
.qs.warn{color:var(--warn)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:78px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:14px}
.bar-t{display:block;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar-f{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar-v{text-align:right;color:var(--muted)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal-t{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:560px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border:0;background:none;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;padding:0;min-width:0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.restbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(68px + env(safe-area-inset-bottom, 0px));
  padding:0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
.rest-in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rest-l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.rest-t{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.rest-actions{display:flex;gap:6px}
.btn.inv{background:transparent;color:var(--bg);border-color:rgba(127,127,127,.6)}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;bottom:calc(132px + env(safe-area-inset-bottom, 0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (min-width:600px){ body{padding-block-start:24px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important;animation:none!important} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Bitácora de gym</h1>
    <div class="date-col">
      <div class="date" id="today"></div>
    </div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<div id="restbar" class="restbar" hidden>
  <div class="rest-in">
    <div><div class="rest-l" id="restlabel">Descanso</div><div class="rest-t" id="resttime">1:30</div></div>
    <div class="rest-actions">
      <button class="btn sm inv" id="rest-plus" data-act="rest-add">+30 s</button>
      <button class="btn sm inv" id="rest-close" data-act="rest-stop">Cerrar</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>Entrenar</button>
    <button class="tab" data-act="tab" data-tab="routines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Rutinas</button>
    <button class="tab" data-act="tab" data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Ejercicios</button>
    <button class="tab" data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Historial</button>
    <button class="tab" data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M8 15l4-5 3 3 5-7"/></svg>Progreso</button>
  </div>
</nav>

<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dateMs = iso => { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).getTime(); };
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtN = n => String(Math.round(n * 100) / 100).replace('.', ',');
const fmtInt = n => Math.round(n).toLocaleString('es-CR');
const key = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const fmtDur = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + ':' + pad(m) + ':' + pad(s % 60) : m + ':' + pad(s % 60); };
const fmtMS = s => Math.floor(s / 60) + ':' + pad(s % 60);
function fmtDay(iso, opts) {
  try { const p = iso.split('-').map(Number); return new Intl.DateTimeFormat('es-CR', opts || { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(p[0], p[1] - 1, p[2])); }
  catch (e) { return iso; }
}
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

const COMMON = ['Press de banca','Press inclinado con mancuernas','Press militar','Elevaciones laterales','Fondos','Extensión de tríceps en polea','Dominadas','Remo con barra','Remo con mancuerna','Jalón al pecho','Remo en polea baja','Curl de bíceps con barra','Curl martillo','Sentadilla','Peso muerto','Peso muerto rumano','Prensa de pierna','Zancadas','Curl femoral','Extensión de cuádriceps','Elevación de talones','Hip thrust','Face pull','Plancha'];
const EXAMPLES = [
  { name: 'Empuje', ex: [['Press de banca',4,8],['Press inclinado con mancuernas',3,10],['Press militar',3,8],['Elevaciones laterales',3,12],['Extensión de tríceps en polea',3,12]] },
  { name: 'Tirón', ex: [['Dominadas',4,8],['Remo con barra',4,8],['Jalón al pecho',3,10],['Curl de bíceps con barra',3,10],['Curl martillo',3,12]] },
  { name: 'Pierna', ex: [['Sentadilla',4,8],['Peso muerto rumano',3,10],['Prensa de pierna',3,12],['Curl femoral',3,12],['Elevación de talones',4,15]] }
];
/* Biblioteca: [nombre, grupo, equipo, pasos, consejo] */
const GROUPS = ['Pecho','Espalda','Hombros','Bíceps','Tríceps','Pierna','Glúteos','Core','Cardio'];
const LIB = [

['Jalón al pecho','Espalda','Polea',['Siéntate con los muslos fijos bajo el soporte y agarra la barra más ancho que los hombros.','Baja la barra hasta la parte alta del pecho, llevando los codos hacia abajo y atrás.','Sube controlado hasta estirar los brazos sin que el peso te levante.'],'No te recuestes hacia atrás para balancear el peso.'],
['Remo con barra','Espalda','Barra',['Inclina el torso hacia delante con la espalda recta y las rodillas ligeramente flexionadas.','Tira de la barra hacia el abdomen llevando los codos hacia atrás.','Baja despacio hasta estirar los brazos, sin redondear la espalda.'],'Si la espalda se redondea, baja el peso.'],
['Remo con mancuerna','Espalda','Mancuerna',['Apoya una rodilla y una mano en un banco, con la espalda recta y paralela al suelo.','Tira de la mancuerna hacia la cadera, con el codo cerca del cuerpo.','Baja controlado hasta estirar el brazo, sin girar el torso.'],'Piensa en llevar el codo hacia el bolsillo trasero, no la mano.'],
['Remo en polea baja','Espalda','Polea',['Siéntate con los pies en el apoyo, las rodillas ligeramente flexionadas y la espalda recta.','Tira del agarre hacia el abdomen juntando los omóplatos.','Regresa estirando los brazos sin encorvar la espalda.'],'Mantén el torso quieto: el movimiento sale de los brazos y la espalda.'],

['Hiperextensiones','Espalda','Banco romano',['Ajusta el banco para que la cadera quede libre y los pies firmes.','Baja el torso con la espalda recta hasta sentir el estiramiento atrás de los muslos.','Sube hasta alinear el cuerpo, sin arquear de más la zona lumbar.'],'Sube hasta quedar recto, no más arriba.'],
['Press militar','Hombros','Barra',['De pie, con la barra a la altura de los hombros y los codos un poco por delante.','Empuja la barra hacia arriba, echando la cabeza un poco atrás para que pase, y estira los brazos.','Baja controlado hasta la clavícula, apretando el abdomen y los glúteos.'],'No arquees la espalda baja: aprieta el abdomen.'],
['Press de hombros con mancuernas','Hombros','Mancuernas',['Siéntate con la espalda apoyada y las mancuernas a la altura de los hombros.','Empuja hacia arriba hasta estirar los brazos sin chocar las mancuernas.','Baja controlado hasta que los codos queden cerca de 90°.'],'Los antebrazos se mantienen verticales todo el recorrido.'],
['Elevaciones laterales','Hombros','Mancuernas',['De pie, con una mancuerna en cada mano a los lados y los codos ligeramente flexionados.','Sube los brazos hacia los lados hasta la altura de los hombros.','Baja despacio, sin balancear el cuerpo.'],'Usa poco peso: el hombro lateral es un músculo pequeño. Sube guiando con los codos.'],
['Elevaciones frontales','Hombros','Mancuernas',['De pie con las mancuernas frente a los muslos.','Sube un brazo al frente hasta la altura del hombro.','Baja controlado y alterna con el otro brazo.'],'Evita balancear el torso para subir el peso.'],
['Pájaros','Hombros','Mancuernas',['Inclina el torso hacia delante con la espalda recta y las mancuernas colgando.','Abre los brazos hacia los lados hasta la altura de la espalda, con los codos ligeramente flexionados.','Baja despacio sin perder la postura.'],'Trabaja la parte de atrás del hombro, buena para la postura.'],
['Face pull','Hombros','Polea',['Ajusta la polea a la altura de la cara con una cuerda.','Tira de la cuerda hacia la cara, abriendo los codos hacia los lados.','Regresa controlado estirando los brazos.'],'Mantén el torso quieto y los codos altos.'],
['Encogimientos de hombros','Hombros','Mancuernas',['De pie con una mancuerna en cada mano a los lados.','Sube los hombros hacia las orejas lo más que puedas.','Baja despacio sin girar los hombros.'],'Sube recto, sin rotar los hombros hacia atrás.'],
['Curl de bíceps con barra','Bíceps','Barra',['De pie, con la barra en las manos, las palmas al frente y los brazos estirados.','Sube la barra doblando los codos sin moverlos hacia delante.','Baja despacio hasta estirar los brazos.'],'Pega los codos al torso y no balancees la espalda.'],
['Curl con mancuernas alterno','Bíceps','Mancuernas',['De pie con una mancuerna en cada mano, palmas al frente.','Sube una mancuerna doblando el codo sin moverlo del costado.','Baja controlado y repite con el otro brazo.'],'Gira la muñeca hacia fuera al subir para apretar más el bíceps.'],
['Curl martillo','Bíceps','Mancuernas',['De pie con las mancuernas a los lados y las palmas mirando hacia el cuerpo.','Sube las mancuernas manteniendo esa posición, sin girar la muñeca.','Baja controlado hasta estirar los brazos.'],'También trabaja el antebrazo.'],

['Curl en polea','Bíceps','Polea',['Párate frente a la polea baja y agarra la barra con las palmas al frente.','Sube el agarre doblando los codos, pegados al torso.','Baja controlado sin soltar la tensión.'],'La polea mantiene tensión constante en todo el recorrido.'],

['Fondos en banco','Tríceps','Peso corporal',['Apoya las manos en el borde de un banco, con las piernas estiradas al frente.','Baja el cuerpo doblando los codos hacia atrás hasta unos 90°.','Empuja hasta estirar los brazos.'],'Si sientes el hombro, no bajes tanto.'],
['Press de banca con agarre cerrado','Tríceps','Barra',['Acuéstate en el banco y agarra la barra con las manos al ancho de los hombros.','Baja la barra al pecho con los codos pegados al cuerpo.','Empuja hasta estirar los brazos.'],'No juntes demasiado las manos: al ancho de los hombros basta.'],
['Patada de tríceps','Tríceps','Mancuerna',['Inclina el torso con la espalda recta, el brazo pegado al costado y el codo doblado a 90°.','Estira el brazo hacia atrás hasta dejarlo recto.','Regresa controlado sin mover el codo.'],'Usa poco peso y aprieta el tríceps al final del movimiento.'],
['Sentadilla','Pierna','Barra',['Pon la barra sobre la parte alta de la espalda, con los pies al ancho de los hombros y las puntas ligeramente abiertas.','Baja doblando cadera y rodillas, con el pecho arriba y la espalda recta, hasta que los muslos queden paralelos al suelo.','Empuja el suelo con todo el pie para subir, sin dejar que las rodillas se vayan hacia dentro.'],'Las rodillas siguen la dirección de las puntas de los pies.'],
['Sentadilla goblet','Pierna','Mancuerna',['Sostén una mancuerna pegada al pecho con las dos manos.','Baja en sentadilla con el pecho arriba y los codos entre las rodillas.','Sube empujando el suelo.'],'Sirve para aprender la sentadilla antes de pasar a la barra.'],
['Prensa de pierna','Pierna','Máquina',['Siéntate con la espalda y los glúteos bien apoyados y los pies al ancho de los hombros en la plataforma.','Baja la plataforma doblando las rodillas sin que la cadera se despegue del asiento.','Empuja hasta casi estirar las piernas, sin bloquear las rodillas.'],'No bloquees las rodillas arriba.'],
['Zancadas','Pierna','Mancuernas o peso corporal',['De pie, da un paso largo hacia delante.','Baja hasta que la rodilla de atrás casi toque el suelo, con el torso recto.','Empuja con la pierna de adelante para volver y alterna.'],'La rodilla de adelante queda sobre el pie y no pasa mucho de la punta.'],
['Sentadilla búlgara','Pierna','Mancuernas',['Apoya el pie de atrás sobre un banco y da un paso largo adelante con la otra pierna.','Baja doblando la rodilla de adelante, con el torso recto.','Sube empujando con el pie de adelante y repite del otro lado.'],'Cuesta al inicio: empieza sin peso.'],

['Plancha lateral','Core','Peso corporal',['Acuéstate de lado apoyando el antebrazo bajo el hombro.','Sube la cadera hasta alinear el cuerpo.','Mantén el tiempo y cambia de lado.'],'Mantén la cadera arriba, sin que se hunda.'],
['Giros rusos','Core','Mancuerna o balón',['Siéntate con las rodillas dobladas y el torso inclinado un poco hacia atrás.','Gira el torso llevando el peso de un lado al otro.','Mantén la espalda recta durante todo el movimiento.'],'Puedes dejar los pies apoyados para hacerlo más fácil.'],
['Crunch en polea','Core','Polea',['Arrodíllate frente a la polea alta y sujeta la cuerda junto a la cabeza.','Dobla el torso hacia las rodillas contrayendo el abdomen.','Sube controlado sin usar los brazos para tirar.'],'El movimiento sale del abdomen, no de la cadera.']

function renderBanner() {
  let h = '';
  if (S.ui.saveErr) h += '<p class="note warn" style="margin-bottom:12px">No se pudo guardar el último cambio. Revisa tu conexión; se reintenta con el siguiente cambio. (' + esc(String(S.ui.saveErr)) + ')</p>';
  if (store && store.kind === 'local') {
    if (!STANDALONE) h += '<p class="note" style="margin-bottom:12px">Sin sesión iniciada: tus datos quedan solo en este navegador.</p>';
    else if (allSessions().length && Date.now() - lastBackupMs() > 14 * 864e5) h += '<p class="note" style="margin-bottom:12px">Tus datos viven solo en este teléfono. <button class="lnk" data-act="tab" data-tab="history">Haz una copia de seguridad</button>.</p>';
  }
  $('#banner').innerHTML = h;
}
function toast(m) { const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2400); }

/* ---------- Acciones ---------- */
function buildSets(name, n, reps, prev) {
  const p = (prev[key(name)] || []).filter(x => x.type !== 'w');
  if (isCardio(name)) { const q = p[p.length - 1]; return [{ kg: '', reps: q ? String(q.reps) : '20', lvl: q && q.lvl ? String(q.lvl) : '', done: false }]; }
  return Array.from({ length: n }, (_, i) => { const q = p[i] || p[p.length - 1]; return { kg: q && q.kg ? String(q.kg) : '', reps: q ? String(q.reps) : (reps ? String(reps) : ''), done: false }; });
}
function startSession(id) {
  if (S.active) { S.tab = 'train'; render(); return; }
  const r = id ? S.routines.find(x => x.id === id) : null, prev = lastLog();
  S.active = { id: uid(), date: todayISO(), start: Date.now(), routineId: r ? r.id : null, name: r ? r.name : 'Entrenamiento libre',
    exercises: (r ? r.exercises : []).map(x => ({ id: uid(), name: x.name, target: isCardio(x.name) ? null : x.sets + ' × ' + x.reps, sets: buildSets(x.name, x.sets, x.reps, prev) })) };
  S.ui.finishMsg = false; S.tab = 'train'; queue('active'); render(); window.scrollTo(0, 0);
}
function exById(id) { return S.active && S.active.exercises.find(e => e.id === id); }
function startRest(type) { const secs = type === 'w' ? Math.max(30, Math.round(S.restSecs / 2)) : S.restSecs; S.rest = { end: Date.now() + secs * 1000, buzzed: false }; }
function finishSession(mode) {
  try { finishSession2(mode); }
  catch (err) { S.ui.finishErr = String((err && err.message) || err).slice(0, 160); try { render(); } catch (e2) {} const el = $('#main .note.warn'); if (el) el.scrollIntoView({ block: 'center' }); }
}
function finishSession2(mode) {
  const a = S.active; S.ui.finishErr = '';
  if (mode === 'fill') fillPending();
  const exs = a.exercises.map(e => ({ name: e.name, sets: e.sets.filter(s => s.done).map(s => { const o = { kg: num(s.kg) || 0, reps: Math.round(num(s.reps) || 0) }; if (s.type) o.type = s.type; if (s.lvl && String(s.lvl).trim()) o.lvl = String(s.lvl).trim().slice(0, 20); return o; }) })).filter(e => e.sets.length);
  if (!exs.length) { S.ui.finishMsg = true; render(); const nw = $('#main .note.warn'); if (nw) nw.scrollIntoView({ block: 'center' }); return; }
  const prs = markRecords(exs);
  const s = { id: a.id, date: a.date, start: a.start, end: Date.now(), name: a.name, exercises: exs }, mk = a.date.slice(0, 7);
  (S.months[mk] = S.months[mk] || []).push(s); flush('m_' + mk);
  S.active = null; flush('active'); S.rest = null; S.ui.finishMsg = false; S.ui.open = {}; S.ui.open[s.id] = true;
  S.tab = 'history'; render(); window.scrollTo(0, 0); toast(prs.length ? (prs.length === 1 ? 'Récord personal en ' + prs[0] : prs.length + ' récords personales') : 'Entrenamiento guardado');
}
function openDraft(r) {
  S.tab = 'routines';
  S.ui.draft = r ? { id: r.id, name: r.name, exercises: r.exercises.map(e => ({ name: e.name, sets: String(e.sets), reps: String(e.reps) })) }
                 : { id: null, name: '', exercises: [{ name: '', sets: '3', reps: '10' }] };
}
function saveDraft() {
  const d = S.ui.draft;
  const ex = d.exercises.filter(x => x.name.trim()).map(x => ({ name: x.name.trim(), sets: Math.max(1, Math.min(10, parseInt(x.sets, 10) || 3)), reps: Math.max(1, Math.min(100, parseInt(x.reps, 10) || 10)) }));
  if (!ex.length) { d.err = 'Agrega al menos un ejercicio con nombre.'; render(); return; }
  const r = { id: d.id || uid(), name: d.name.trim() || 'Rutina', exercises: ex };
  const i = S.routines.findIndex(x => x.id === r.id);
  if (i >= 0) S.routines[i] = r; else S.routines.push(r);
  S.ui.draft = null; queue('routines'); render(); window.scrollTo(0, 0); toast('Rutina guardada');
}
function doConfirmed(k) {
  const i = k.indexOf(':'), kind = i < 0 ? k : k.slice(0, i), id = i < 0 ? '' : k.slice(i + 1);
  S.ui.confirm = '';
  if (kind === 'rdel') { S.routines = S.routines.filter(r => r.id !== id); queue('routines'); }
  else if (kind === 'hdel') { Object.keys(S.months).forEach(m => { const n = S.months[m].filter(s => s.id !== id); if (n.length !== S.months[m].length) { S.months[m] = n; queue('m_' + m); } }); }
  else if (kind === 'xdel') { S.active.exercises = S.active.exercises.filter(e => e.id !== id); queue('active'); }
  else if (kind === 'discard') { S.active = null; S.rest = null; queue('active'); }
  render();
}
async function exportCSV() {
  if (!DL) return;
  const rows = [['fecha', 'rutina', 'ejercicio', 'serie', 'tipo', 'kg', 'lb', 'reps']];
  allSessions().forEach(s => s.exercises.forEach(e => e.sets.forEach((st, i) => rows.push([s.date, s.name, e.name, i + 1, TYPE_NAME[st.type || 'n'], Math.round(st.kg * 100) / 100, Math.round(st.kg * LB * 10) / 10, st.reps]))));
  const csv = '﻿' + rows.map(r => r.map(c => { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\n');
  try { await DL.save({ filename: 'bitacora-gym-' + todayISO() + '.csv', data: csv }); toast('Archivo guardado'); }
  catch (e) { if (!e || e.code !== 'declined') toast('No se pudo exportar'); }
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, d = t.dataset;
  if (a === 'tab') { S.tab = d.tab; S.ui.confirm = ''; render(); window.scrollTo(0, 0); }
  else if (a === 'start') startSession(d.id);
  else if (a === 'examples') { S.routines = S.routines.concat(EXAMPLES.map(r => ({ id: uid(), name: r.name, exercises: r.ex.map(x => ({ name: x[0], sets: x[1], reps: x[2] })) }))); queue('routines'); render(); }
  else if (a === 'set-done') { const e = exById(d.ex); if (!e) return; const s = e.sets[+d.set]; s.done = !s.done; S.ui.finishMsg = false; if (s.done) startRest(s.type); queue('active'); render(); }
  else if (a === 'add-set') { const e = exById(d.ex), l = e.sets[e.sets.length - 1]; e.sets.push({ kg: l ? l.kg : '', reps: l ? l.reps : '', done: false }); queue('active'); render(); }
  else if (a === 'rm-set') { const e = exById(d.ex); if (e.sets.length > 1) { e.sets.pop(); queue('active'); render(); } }
  else if (a === 'add-ex') {
    const inp = $('#newex'), name = inp ? inp.value.trim() : ''; if (!name) { if (inp) inp.focus(); return; }
    S.active.exercises.push({ id: uid(), name, target: null, sets: buildSets(name, 3, '', lastLog()) }); queue('active'); render();
  }
  else if (a === 'finish') finishSession();
  else if (a === 'finish-fill') finishSession('fill');
  else if (a === 'ex-unit') { S.units = S.units || {}; S.units[d.k] = d.u === 'lb' ? 'lb' : 'kg'; queue('routines'); render(); }
  else if (a === 'pl-unit') { S.ui.plU = d.u === 'lb' ? 'lb' : 'kg'; S.ui.plBar = ''; S.ui.plTotal = ''; render(); }
  else if (a === 'lib-equip') { S.ui.libE = d.e; render(); }
  else if (a === 'quick-equip') { S.ui.quickE = d.e; render(); }
  else if (a === 'rest-add') { if (S.rest) { S.rest.end += 30000; S.rest.buzzed = false; tick(); } }
  else if (a === 'rest-stop') { S.rest = null; tick(); }
  else if (a === 'rest-secs') { S.restSecs = +d.v; queue('routines'); render(); }
  else if (a === 'ask') { S.ui.confirm = d.key; render(); }
  else if (a === 'do') doConfirmed(d.key);
  else if (a === 'routine-new') { openDraft(null); render(); window.scrollTo(0, 0); }
  else if (a === 'routine-edit') { openDraft(S.routines.find(r => r.id === d.id)); render(); window.scrollTo(0, 0); }
  else if (a === 'routine-cancel') { S.ui.draft = null; render(); }
  else if (a === 'routine-save') saveDraft();
  else if (a === 'rex-add') { S.ui.draft.exercises.push({ name: '', sets: '3', reps: '10' }); render(); }
  else if (a === 'rex-rm') { S.ui.draft.exercises.splice(+d.i, 1); if (!S.ui.draft.exercises.length) S.ui.draft.exercises.push({ name: '', sets: '3', reps: '10' }); render(); }
  else if (a === 'hist-toggle') { S.ui.open[d.id] = !S.ui.open[d.id]; render(); }
  else if (a === 'set-type') { const e = exById(d.ex); if (!e) return; const s = e.sets[+d.set], t = s.type || 'n', nx = t === 'n' ? 'w' : t === 'w' ? 'd' : 'n'; if (nx === 'n') delete s.type; else s.type = nx; queue('active'); render(); }
  else if (a === 'quick') startQuick(d.g);
  else if (a === 'hist-repeat') repeatSession(d.id);
  else if (a === 'routine-dup') { const r = S.routines.find(x => x.id === d.id); if (r) { S.routines.splice(S.routines.indexOf(r) + 1, 0, { id: uid(), name: r.name + ' (copia)', exercises: r.exercises.map(e => ({ name: e.name, sets: e.sets, reps: e.reps })) }); queue('routines'); render(); toast('Rutina duplicada'); } }
  else if (a === 'prog-add') {
    const p = PROGRAMS.find(x => x.id === d.id);
    if (p) { p.days.forEach(day => { if (!S.routines.some(r => key(r.name) === key(day.name))) S.routines.push({ id: uid(), name: day.name, exercises: day.ex.map(x => ({ name: x[0], sets: x[1], reps: x[2] })) }); }); queue('routines'); render(); toast('Programa agregado'); }
  }
  else if (a === 'lib-toggle') { S.ui.libOpen[d.k] = !S.ui.libOpen[d.k]; render(); }
  else if (a === 'lib-group') { S.ui.libG = d.g; render(); }
  else if (a === 'how-toggle') { S.ui.howOpen[d.k] = !S.ui.howOpen[d.k]; render(); }
  else if (a === 'lib-add') {
    const x = LIBMAP[d.k];
    if (x && S.active) { S.active.exercises.push({ id: uid(), name: x[0], target: null, sets: buildSets(x[0], 3, '', lastLog()) }); queue('active'); S.tab = 'train'; render(); window.scrollTo(0, document.body.scrollHeight); toast('Agregado: ' + x[0]); }
  }
  else if (a === 'backup-save') saveBackup();
  else if (a === 'restore-pick') { const f = $('#restore-file'); if (f) f.click(); }
  else if (a === 'restore-yes') applyRestore();
  else if (a === 'restore-no') { S.ui.restore = null; render(); }
  else if (a === 'export') exportCSV();
});
document.addEventListener('input', ev => {
  const t = ev.target, k = t.dataset && t.dataset.in;
  if (k === 'kg' || k === 'reps' || k === 'lvl') {
    const e = exById(t.dataset.ex);
    if (e) { const st = e.sets[+t.dataset.set]; if (k === 'kg') { const v = num(t.value); st.kg = v == null ? '' : String(Math.round(inUnit(e.name, () => fromDisp(v)) * 10000) / 10000); } else if (k === 'lvl') st.lvl = t.value; else st.reps = t.value; queue('active'); }
  }
  else if (k === 'rname' && S.ui.draft) S.ui.draft.name = t.value;
  else if (k === 'rex-name' && S.ui.draft) S.ui.draft.exercises[+t.dataset.i].name = t.value;
  else if (k === 'rex-sets' && S.ui.draft) S.ui.draft.exercises[+t.dataset.i].sets = t.value;
  else if (k === 'rex-reps' && S.ui.draft) S.ui.draft.exercises[+t.dataset.i].reps = t.value;
  else if (t.id === 'exq') { S.ui.libQ = t.value; $('#lib-out').innerHTML = libItems(); }
  else if (t.id === 'pl-total') { S.ui.plTotal = t.value; $('#pl-out').innerHTML = platesOut(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'pl-bar') { S.ui.plBar = t.value; $('#pl-out').innerHTML = platesOut(); }
  else if (t.id === 'exsel') { S.ui.progEx = t.value; render(); }
  else if (t.id === 'restore-file') { const f = t.files && t.files[0]; if (f) readBackup(f); t.value = ''; }
  else if (t.id === 'goal-kg') { const v = num(t.value), k = key(t.dataset.name); if (v && v > 0) S.goals[k] = { name: t.dataset.name, kg: inUnit(t.dataset.name, () => fromDisp(v)) }; else delete S.goals[k]; queue('goals'); render(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'newex') { ev.preventDefault(); const b = $('#addex-btn'); if (b) b.click(); } });

function tick() {
  const el = $('#elapsed'); if (el && S.active) el.textContent = fmtDur(Date.now() - S.active.start);
  const bar = $('#restbar'), r = S.rest;
  if (!r) { bar.hidden = true; return; }
  const left = Math.ceil((r.end - Date.now()) / 1000);
  if (left <= -8) { S.rest = null; bar.hidden = true; return; }
  bar.hidden = false;
  $('#restlabel').textContent = left > 0 ? 'Descanso' : 'Descanso listo';
  $('#resttime').textContent = left > 0 ? fmtMS(left) : '0:00';
  if (left <= 0 && !r.buzzed) { r.buzzed = true; try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} }
}
setInterval(tick, 500);

/* ---------- Arranque ---------- */
async function init() {
  $('#today').textContent = fmtDay(todayISO(), { weekday: 'long', day: 'numeric', month: 'long' });
  render();
  if (STANDALONE) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const res = await Promise.all([use('db'), use('user'), use('downloads')]);
  const db = res[0], user = res[1]; DL = res[2] || (STANDALONE ? browserSave : null);
  const id = user ? await user.id() : null;
  if (db && id) {
    store = { kind: 'db', col: db.collection('data/users/' + id) };
    store.col.onSnapshot(applySnapshot, () => {
      store = { kind: 'local' }; localLoad(); S.loaded = true; render();
    });
  } else {
    store = { kind: 'local' }; localLoad(); S.loaded = true; render();
  }
}
init();
})();
</script>
